<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form action="index.html" method="get">
        <div class="leftside">
            <img class="logo" src="odin-logo.png" alt="odin-logo">
            <footer>Photo by Halie West on Unsplash</footer>
        </div>
         <div class="rightside">
              <div class="text"><h3>This is not a <em> real </em>online service! You know you need something like this in your life to help you realize your deepest dreams.</h3> <h3>Sign up <em> now </em> to get started</h3> <h3>You<em> know </em> you want this.</h3></div>
               <div class="card">
                <div class="header">
            <h3> <strong> Let's do this !</strong></h3>
            </div>
            <div class="column-wrapper">
        <div class="column1">
            <div class="row">
        <label for="First_name"> First name </label>
        <input type="text" id="First_name" name="First_name">
            </div>

            <div class="row">
        <label for="email"> *Email </label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="row">
        <label for="password"> *Password</label>
        <input type="password" id="password" name="password" required>
        </div>

        </div>

           <div class="column2">
            <div class="row">
        <label for="last_name"> Last name </label>
        <input type="text" id="last_name" name="last_name">
        </div>

          <div class="row">
        <label for="phone_number"> *Phone number </label>
        <input type="number" id="phone_number" name="phone_number" required>
        </div>

          <div class="row">
        <label for="Confirmed_password"> *Confirmed password</label>
        <input type="password" id="Confirmed_password" name="Confirmed_password" required>
    </div>
 </div>
 </div>
</div>
<button type="submit">Create Account</button>
<p> Already have an account ? <a href="#">Log in.</a></p>
</div>

    </form>
</body>
</html>
